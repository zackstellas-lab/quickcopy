<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Copy</title>
<style>
:root{--bg:#0b1020;--panel:#111827;--border:#293548;--text:#eef2ff;--muted:#9aa8bd;--primary:#6366f1;--primaryHover:#4f46e5;--sidebar:#0f172a;--sidebarHover:#1e293b;--sidebarActive:#312e81;--input:#0b1220;--card:#111827;--header:#172033;--entry:#0b1220;--button:#172033;--buttonHover:#243047;--danger:#ef4444;--success:#10b981;--modal:#111827;--accentText:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}.app{min-height:100vh;display:flex}.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--sidebar);border-right:1px solid var(--border);padding:14px 10px;overflow:auto}.brand{font-weight:900;font-size:20px;padding:6px 9px 18px}.side-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;padding:0 9px 7px}.side-btn{width:100%;display:flex;gap:8px;align-items:center;border:0;background:transparent;color:var(--text);padding:10px;border-radius:8px;text-align:left;cursor:pointer}.side-btn:hover{background:var(--sidebarHover)}.side-btn.active{background:var(--sidebarActive)}.side-btn .count{margin-left:auto;color:var(--muted);font-size:10px}.side-bottom{border-top:1px solid var(--border);margin-top:14px;padding-top:10px;display:grid;gap:5px}.main{margin-left:220px;width:calc(100% - 220px);min-width:0}.top{position:sticky;top:0;z-index:20;height:58px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px}.title{font-size:18px;font-weight:900}.search{flex:1;max-width:520px;margin-left:10px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);height:36px;padding:0 11px}.actions{margin-left:auto;display:flex;gap:6px}.btn{border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:7px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.btn:hover{background:var(--buttonHover)}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--accentText)}.btn.primary:hover{background:var(--primaryHover)}.btn.danger{color:var(--danger)}.content{padding:12px}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hero h1{font-size:22px;margin:0}.hero small{color:var(--muted)}.kpis{display:flex;gap:6px}.kpi{border:1px solid var(--border);background:var(--panel);padding:6px 10px;border-radius:8px;text-align:center}.kpi strong{display:block}.kpi span{font-size:9px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}.card{background:var(--card);border:1px solid var(--border);border-radius:9px;overflow:hidden;min-width:0}.card{--subColor:var(--header)}.card summary{list-style:none;cursor:pointer;padding:9px 9px;display:flex;align-items:center;gap:6px;background:var(--subColor);font-size:13px;font-weight:900}.card summary::-webkit-details-marker{display:none}.card summary:before{content:'›';font-size:18px;transform:rotate(90deg);color:var(--muted)}.card:not([open]) summary:before{transform:rotate(0)}.card .count{margin-left:auto;color:var(--muted);font-size:10px}.sub-add-btn{width:25px;height:25px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:6px;cursor:pointer;font-size:16px;font-weight:900;flex:0 0 auto}.sub-add-btn:hover{background:var(--buttonHover)}.sub-settings-btn{width:25px;height:25px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;flex:0 0 auto}.sub-settings-btn:hover{background:var(--buttonHover)}.body{padding:7px;display:grid;gap:6px}.entry{display:grid;grid-template-columns:minmax(0,1fr) 50px;gap:5px;padding:4px;background:var(--entry);border:1px solid var(--border);border-radius:7px}.entry textarea{width:100%;height:31px;min-height:31px;resize:none;background:var(--input);color:var(--text);border:1px solid transparent;border-radius:5px;padding:6px;font-size:13px;line-height:1.3;outline:none}.entry textarea:focus{border-color:var(--primary)}.entry-actions{display:flex;flex-direction:column;gap:4px}.copy{width:50px;height:31px;padding:3px;font-size:10px}.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:5px;padding:5px}.icon:hover{background:var(--buttonHover);color:var(--text)}.empty{padding:12px 4px;text-align:center;color:var(--muted);font-size:11px}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-bg.show{display:flex}.modal{width:min(980px,96vw);max-height:92vh;overflow:auto;background:var(--modal);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 30px 90px #0008}.modal h2{margin:0 0 4px}.sub{font-size:11px;color:var(--muted);margin-bottom:14px}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:9px}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.manage-list{display:grid;gap:8px}.manage-item{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}.manage-item summary{padding:10px 12px;background:var(--header);font-weight:900;cursor:pointer}.manage-body{padding:8px;display:grid;gap:6px}.manage-entry{display:grid;grid-template-columns:1fr auto;gap:6px}.manage-entry textarea{height:60px;resize:none}.layout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:420px;overflow:auto}.sub-layout-item{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:5px;align-items:center;padding:5px;border:1px solid var(--border);border-radius:7px;background:var(--header)}.drag-handle{font-size:16px;text-align:center;cursor:grab;color:var(--muted)}.sub-name-input{width:100%;min-width:0;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:7px;font-size:11px}.sub-layout-item .btn{padding:7px 5px;font-size:10px}.blank-slot{min-height:42px;border:1px dashed var(--border);border-radius:9px;background:transparent}.blank-layout-item{background:var(--input)}.blank-label{font-size:11px;color:var(--muted);font-weight:800}.delete-btn{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important}.delete-btn:hover{filter:brightness(.9)}.dragging{opacity:.4}.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.subcolors{display:grid;gap:6px;max-height:360px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:7px}.subcolor{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:8px;align-items:center;border:1px solid var(--border);padding:7px 8px;border-radius:7px;background:var(--card)}.subcolor-name{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subcolor input{width:36px;height:28px;padding:0;border:0;background:transparent;cursor:pointer}.color{display:flex;align-items:center;gap:7px;border:1px solid var(--border);padding:6px;border-radius:7px}.color input{width:34px;height:28px;padding:0;border:0}.color span{font-size:10px;color:var(--muted)}.list{display:grid;gap:6px}.list-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}.list-row .btn,.sub-layout-item .btn{white-space:nowrap}.settings-actions{display:flex;gap:5px;align-items:center}.toast{position:fixed;right:16px;bottom:16px;background:var(--modal);border:1px solid var(--border);padding:10px 13px;border-radius:8px;display:none;z-index:200}.toast.show{display:block}
@media(max-width:1500px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:900px){.sidebar{width:64px}.brand{font-size:0;text-align:center}.side-label,.side-btn span:not(.count),.count{display:none}.main{margin-left:64px;width:calc(100% - 64px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.colors{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:1fr}.colors{grid-template-columns:1fr}.top{flex-wrap:wrap;height:auto;padding:8px}.search{order:3;max-width:none;flex-basis:100%}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand">⚡ Quick Copy</div><div class="side-label">Categories</div><div id="mainTabs"></div><div class="side-bottom"><button class="side-btn" id="sideSettings">⚙ <span>Category Settings</span></button><button class="side-btn" id="exportBtn">⇩ <span>Export</span></button><button class="side-btn" id="importBtn">⇧ <span>Import</span></button><input id="file" type="file" accept="application/json" hidden></div></aside>
<main class="main"><header class="top"><div class="title">Quick Copy</div><input id="search" class="search" placeholder="Search saved text..."><div class="actions"><button class="btn" id="manageBtn">Manage</button><button class="btn" id="settingsBtn">⚙ Category Settings</button><button class="btn primary" id="addTextBtn">+ Add Text</button></div></header><section class="content"><div class="hero"><div><small id="eyebrow"></small><h1 id="categoryTitle"></h1></div><div class="kpis"><div class="kpi"><strong id="totalCount">0</strong><span>saved texts</span></div><div class="kpi"><strong id="subCount">0</strong><span>subcategories</span></div></div></div><div id="grid" class="grid"></div></section></main></div>
<div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const KEY='quick-copy-v2';
const DEFAULT_COLORS={bg:'#0b1020',panel:'#111827',border:'#293548',text:'#eef2ff',muted:'#9aa8bd',primary:'#6366f1',primaryHover:'#4f46e5',sidebar:'#0f172a',sidebarHover:'#1e293b',sidebarActive:'#312e81',input:'#0b1220',card:'#111827',header:'#172033',entry:'#0b1220',button:'#172033',buttonHover:'#243047',danger:'#ef4444',success:'#10b981',modal:'#111827',accentText:'#ffffff'};
const COLOR_NAMES={bg:'App background',panel:'Panels',border:'Borders',text:'Main text',muted:'Muted text',primary:'Primary',primaryHover:'Primary hover',sidebar:'Sidebar',sidebarHover:'Sidebar hover',sidebarActive:'Sidebar active',input:'Inputs / text boxes',card:'Subcategory cards',header:'Dropdown headers',entry:'Text containers',button:'Buttons',buttonHover:'Button hover',danger:'Danger',success:'Success',modal:'Modal',accentText:'Button text'};
function makeSub(name='Subcategory'){return {id:crypto.randomUUID(),name,color:'',entries:[]}}
function makeCat(name='Category'){const subs=Array.from({length:21},(_,i)=>makeSub(`Subcategory ${i+1}`));return {id:crypto.randomUUID(),name,subs,grid:subs.map(s=>s.id)}}
function initial(){return {cats:Array.from({length:4},(_,i)=>makeCat(`Category ${i+1}`)),active:0,copySeconds:30,colors:{...DEFAULT_COLORS}}}
function normalize(x){if(!x||!Array.isArray(x.cats))return initial();x.cats=x.cats.filter(Boolean);x.cats.forEach(c=>{c.id=c.id||crypto.randomUUID();c.name=String(c.name||'Category');c.subs=Array.isArray(c.subs)?c.subs:[];c.subs.forEach(s=>{s.id=s.id||crypto.randomUUID();s.name=String(s.name||'Subcategory');s.color=typeof s.color==='string'?s.color:'';s.entries=Array.isArray(s.entries)?s.entries.map(v=>String(v??'')):[]})});if(!x.cats.length)x.cats.push(makeCat('Category 1'));x.active=Math.max(0,Math.min(x.cats.length-1,Number(x.active)||0));x.copySeconds=Math.max(0,Number(x.copySeconds)||0);x.colors={...DEFAULT_COLORS,...(x.colors||{})};return x}
let data;try{data=normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){data=initial()}save();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyColors(){Object.entries(data.colors).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1500)}
function openModal(html,wide=false){const m=document.getElementById('modal');m.className='modal';m.innerHTML=html;document.getElementById('modalBg').classList.add('show')}function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function render(){applyColors();const cat=data.cats[data.active];document.getElementById('eyebrow').textContent='Active category';document.getElementById('categoryTitle').textContent=cat.name;document.getElementById('totalCount').textContent=cat.subs.reduce((a,s)=>a+s.entries.filter(Boolean).length,0);document.getElementById('subCount').textContent=cat.subs.length;document.getElementById('mainTabs').innerHTML=data.cats.map((c,i)=>`<button class="side-btn ${i===data.active?'active':''}" data-cat="${c.id}">▦ <span>${esc(c.name)}</span><span class="count">${c.subs.reduce((a,s)=>a+s.entries.filter(Boolean).length,0)}</span></button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{data.active=data.cats.findIndex(c=>c.id===b.dataset.cat);save();render()});const q=document.getElementById('search').value.trim().toLowerCase();const slots=Array.isArray(cat.grid)?cat.grid:cat.subs.map(s=>s.id);document.getElementById('grid').innerHTML=slots.map((id)=>{if(id===null)return '<div class="blank-slot" aria-label="Blank grid spot"></div>';const s=cat.subs.find(x=>x.id===id);if(!s)return '';const rows=s.entries.map((v,i)=>({v,i})).filter(x=>!q||x.v.toLowerCase().includes(q));return `<details class="card" open data-sub="${s.id}" ${s.color?`style="--subColor:${esc(s.color)}"`:''}><summary><span class="sub-label">${esc(s.name)}</span><span class="count">${s.entries.filter(Boolean).length}</span><button class="sub-add-btn" type="button" data-sub-add="${s.id}" title="Add text" aria-label="Add text">+</button><button class="sub-settings-btn" type="button" data-sub-settings="${s.id}" title="Subcategory settings" aria-label="Subcategory settings">⚙</button></summary><div class="body">${rows.length?rows.map(x=>entryHtml(s,x.i,x.v)).join(''):'<div class="empty">No text saved yet.</div>'}</div></details>`}).join('');document.querySelectorAll('[data-sub-settings]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();openSubSettings(b.dataset.subSettings)});document.querySelectorAll('[data-sub-add]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();openAddText(b.dataset.subAdd)});attachEntryEvents()}
function entryHtml(s,i,v){return `<div class="entry"><textarea data-sub="${s.id}" data-i="${i}" placeholder="Enter saved text...">${esc(v)}</textarea><div class="entry-actions"><button class="btn copy" data-copy-sub="${s.id}" data-copy-i="${i}">Copy</button></div></div>`}
function attachEntryEvents(){document.querySelectorAll('textarea[data-sub]').forEach(t=>t.oninput=()=>{const s=findSub(t.dataset.sub);if(s){s.entries[+t.dataset.i]=t.value;save()}});document.querySelectorAll('[data-copy-sub]').forEach(b=>b.onclick=()=>copyEntry(b.dataset.copySub,+b.dataset.copyI,b));}
function findSub(id){for(const c of data.cats){const s=c.subs.find(x=>x.id===id);if(s)return s}return null}
async function copyEntry(id,i,btn){const s=findSub(id);if(!s)return;window.locks=window.locks||{};const until=window.locks[id+'-'+i]||0;if(until>Date.now())return;const text=s.entries[i]||'';try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const sec=data.copySeconds;if(sec>0){const key=id+'-'+i;window.locks[key]=Date.now()+sec*1000;let timer=setInterval(()=>{let left=Math.max(0,Math.ceil((window.locks[key]-Date.now())/1000));if(left<=0){clearInterval(timer);btn.disabled=false;btn.textContent='Copy'}else{btn.disabled=true;btn.textContent=left+'s'}},250);btn.disabled=true;btn.textContent=sec+'s'}toast(sec?`Copied — locked for ${sec} seconds`:'Copied')}
function deleteEntry(id,i){const s=findSub(id);if(s&&confirm('Delete this saved text?')){s.entries.splice(i,1);save();render()}}
function openAddText(preselectSubId=''){openModal(`<h2>Add Text</h2><div class="sub">Choose a category and subcategory, then add a new text box.</div><div class="field"><label>Category</label><select id="addCatSelect">${data.cats.map((c,i)=>`<option value="${c.id}" ${i===data.active?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Subcategory</label><select id="addTextSub"></select></div><div class="field"><label>Text</label><textarea id="newText" placeholder="Enter saved text..."></textarea></div><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="addConfirm">Add Text</button></div>`);const fill=()=>{const c=data.cats.find(c=>c.id===document.getElementById('addCatSelect').value);const sel=document.getElementById('addTextSub');sel.innerHTML=c.subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(preselectSubId&&c.subs.some(s=>s.id===preselectSubId))sel.value=preselectSubId};document.getElementById('addCatSelect').onchange=()=>{preselectSubId='';fill()};fill();document.getElementById('cancel').onclick=closeModal;document.getElementById('addConfirm').onclick=()=>{const s=findSub(document.getElementById('addTextSub').value);if(s){s.entries.push(document.getElementById('newText').value);save();closeModal();render();toast('Text box added')}}}
function openSubSettings(subId){
 const sub=findSub(subId); if(!sub)return;
 const cat=data.cats.find(c=>c.subs.some(s=>s.id===subId));
 openModal(`<h2>Subcategory Settings</h2><div class="sub">Customize this dropdown without leaving the dashboard.</div><div class="field"><label>Subcategory name</label><input id="subSettingName" value="${esc(sub.name)}"></div><div class="field"><label>Dropdown colour</label><div class="subcolor" style="grid-template-columns:minmax(0,1fr) 42px"><span class="subcolor-name">Header colour</span><input id="subSettingColor" type="color" value="${sub.color||data.colors.header}"></div></div><div class="field"><label>Actions</label><div class="modal-actions" style="justify-content:flex-start;margin-top:0"><button class="btn" id="dupSubSetting">Duplicate Subcategory</button><button class="btn danger" id="delSubSetting">Delete Subcategory</button></div></div><div class="modal-actions"><button class="btn" id="closeSubSettings">Close</button><button class="btn primary" id="saveSubSettings">Save Changes</button></div>`);
 document.getElementById('closeSubSettings').onclick=closeModal;
 document.getElementById('saveSubSettings').onclick=()=>{sub.name=document.getElementById('subSettingName').value.trim()||'Subcategory';sub.color=document.getElementById('subSettingColor').value;save();closeModal();render();toast('Subcategory settings saved')};
 document.getElementById('dupSubSetting').onclick=()=>{if(!cat)return;const idx=cat.subs.findIndex(s=>s.id===subId);const copy={...sub,id:crypto.randomUUID(),name:sub.name+' Copy',entries:[...sub.entries]};cat.subs.splice(idx+1,0,copy);save();closeModal();render();toast('Subcategory duplicated')};
 document.getElementById('delSubSetting').onclick=()=>{if(!cat)return;if(cat.subs.length<=1)return alert('You must keep at least one subcategory.');if(confirm(`Delete subcategory "${sub.name}" and all of its saved text?`)){const idx=cat.subs.findIndex(s=>s.id===subId);cat.subs.splice(idx,1);save();closeModal();render();toast('Subcategory deleted')}};
}
function openManage(){const c=data.cats[data.active];openModal(`<h2>Manage — ${esc(c.name)}</h2><div class="sub">All subcategories and all saved text sources in one scrollable column.</div><div class="manage-list">${c.subs.map(s=>`<details class="manage-item"><summary>${esc(s.name)} <span style="float:right;color:var(--muted);font-size:10px">${s.entries.length}</span></summary><div class="manage-body">${s.entries.length?s.entries.map((v,i)=>`<div class="manage-entry"><textarea data-m-sub="${s.id}" data-m-i="${i}">${esc(v)}</textarea><button class="icon" data-m-del="${s.id}" data-m-i="${i}">✕</button></div>`).join(''):'<div class="empty">No text saved yet.</div>'}</div></details>`).join('')}</div><div class="modal-actions"><button class="btn" id="closeM">Close</button></div>`);document.getElementById('closeM').onclick=closeModal;document.querySelectorAll('[data-m-sub]').forEach(t=>t.oninput=()=>{const s=findSub(t.dataset.mSub);if(s){s.entries[+t.dataset.mI]=t.value;save()}});document.querySelectorAll('[data-m-del]').forEach(b=>b.onclick=()=>{const s=findSub(b.dataset.mDel);if(s&&confirm('Delete this saved text?')){s.entries.splice(+b.dataset.mI,1);save();openManage();render()}})}
function openSettings(){openModal(`<h2>Category Settings</h2><div class="sub">Rename, add, delete, arrange, and colour categories/subcategories. Set the copy countdown here too.</div><div class="field"><label>Categories</label><div class="list" id="catList"></div><div class="modal-actions" style="justify-content:flex-start"><button class="btn primary" id="addCat">+ Add Category</button></div></div><div class="field"><label>Copy lock countdown (seconds)</label><input id="seconds" type="number" min="0" step="1" value="${data.copySeconds}"><div class="sub">Use 0 for no lockout.</div></div><div class="field"><label>Subcategory grid for active category</label><div class="layout" id="layout"></div><div class="sub">Drag subcategories and blank spots to arrange the grid. Blank spots are saved as empty positions.</div><div class="modal-actions" style="justify-content:flex-start"><button class="btn" id="addSubcategory">+ Add Subcategory</button><button class="btn" id="addBlank">+ Add Blank Spot</button></div></div><div class="field"><label>Subcategory colours</label><div class="sub">Choose a separate colour for every subcategory. This colour is used on that subcategory's dropdown header.</div><div class="subcolors" id="subcolors"></div></div><div class="field"><label>App colours</label><div class="colors" id="colors"></div></div><div class="modal-actions"><button class="btn" id="cancelS">Cancel</button><button class="btn primary" id="saveS">Save Changes</button></div>`);renderSettings()}
function renderSettings(){
 const catList=document.getElementById('catList');
 catList.innerHTML=data.cats.map((c,i)=>`<div class="list-row"><input data-cn="${c.id}" value="${esc(c.name)}" title="Category name"><button class="btn ${i===data.active?'primary':''}" data-select-cat="${c.id}">Use</button><button class="btn" data-dup-cat="${c.id}" title="Duplicate category">Duplicate</button><button class="btn danger delete-btn" data-del-cat="${c.id}" title="Delete category">Delete</button></div>`).join('');
 catList.querySelectorAll('[data-cn]').forEach(i=>i.oninput=()=>{const c=data.cats.find(c=>c.id===i.dataset.cn);if(c){c.name=i.value;save();render()}});
 catList.querySelectorAll('[data-select-cat]').forEach(b=>b.onclick=()=>{const idx=data.cats.findIndex(c=>c.id===b.dataset.selectCat);if(idx>=0){data.active=idx;save();render();renderSettings()}});
 catList.querySelectorAll('[data-dup-cat]').forEach(b=>b.onclick=()=>{const idx=data.cats.findIndex(c=>c.id===b.dataset.dupCat);if(idx<0)return;const src=data.cats[idx];const newSubs=src.subs.map(s=>({...s,id:crypto.randomUUID(),entries:[...s.entries]}));const idMap=new Map(src.subs.map((s,i)=>[s.id,newSubs[i].id]));const copy={...src,id:crypto.randomUUID(),name:src.name+' Copy',subs:newSubs,grid:(src.grid||src.subs.map(s=>s.id)).map(x=>x===null?null:idMap.get(x)).filter(x=>x===null||x)};data.cats.splice(idx+1,0,copy);data.active=idx+1;save();render();renderSettings()});
 catList.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=()=>{if(data.cats.length<=1)return alert('You must keep at least one category.');const idx=data.cats.findIndex(c=>c.id===b.dataset.delCat);if(idx<0)return;if(confirm(`Delete category "${data.cats[idx].name}" and all of its subcategories?`)){data.cats.splice(idx,1);data.active=Math.max(0,Math.min(data.active,data.cats.length-1));save();render();renderSettings()}});
 const activeCat=data.cats[data.active];
 if(!Array.isArray(activeCat.grid))activeCat.grid=activeCat.subs.map(s=>s.id);
 const slotHtml=activeCat.grid.map((id,pos)=>{if(id===null)return `<div class="sub-layout-item blank-layout-item" draggable="true" data-grid-slot="${pos}" data-blank="true"><span class="drag-handle">☷</span><span class="blank-label">Blank spot</span><button class="btn danger delete-btn" data-del-blank="${pos}">Delete</button></div>`;const sub=activeCat.subs.find(s=>s.id===id);if(!sub)return '';return `<div class="sub-layout-item" draggable="true" data-grid-slot="${pos}" data-drag="${sub.id}"><span class="drag-handle" title="Drag to reorder">☷</span><input class="sub-name-input" data-sn="${sub.id}" value="${esc(sub.name)}" title="Subcategory name"><button class="btn" data-dup-subcat="${sub.id}" title="Duplicate subcategory">Duplicate</button><button class="btn danger delete-btn" data-del-subcat="${sub.id}" title="Delete subcategory">Delete</button></div>`}).join('');
 document.getElementById('layout').innerHTML=slotHtml;
 document.querySelectorAll('[data-sn]').forEach(i=>i.oninput=()=>{const sub=findSub(i.dataset.sn);if(sub){sub.name=i.value;save();render()}});
 document.querySelectorAll('[data-dup-subcat]').forEach(b=>b.onclick=()=>{const c=data.cats[data.active];const idx=c.subs.findIndex(s=>s.id===b.dataset.dupSubcat);if(idx<0)return;const src=c.subs[idx];const copy={...src,id:crypto.randomUUID(),name:src.name+' Copy',entries:[...src.entries]};c.subs.splice(idx+1,0,copy);const pos=c.grid.indexOf(src.id);c.grid.splice(pos+1,0,copy.id);save();render();renderSettings()});
 document.querySelectorAll('[data-del-subcat]').forEach(b=>b.onclick=()=>{const c=data.cats[data.active];const idx=c.subs.findIndex(s=>s.id===b.dataset.delSubcat);if(idx<0)return;if(c.subs.length<=1)return alert('You must keep at least one subcategory.');if(confirm(`Delete subcategory "${c.subs[idx].name}" and all of its saved text?`)){c.subs.splice(idx,1);c.grid=c.grid.filter(x=>x!==b.dataset.delSubcat);save();render();renderSettings()}});
 document.querySelectorAll('[data-del-blank]').forEach(b=>b.onclick=()=>{const c=data.cats[data.active];const pos=Number(b.dataset.delBlank);if(Number.isInteger(pos)){c.grid.splice(pos,1);save();render();renderSettings()}});
 let dragging=null;
 document.querySelectorAll('[data-grid-slot]').forEach(el=>{el.ondragstart=()=>{dragging=el;el.classList.add('dragging')};el.ondragover=e=>{e.preventDefault();if(!dragging||dragging===el)return;const r=el.getBoundingClientRect();document.getElementById('layout').insertBefore(dragging,e.clientY>r.top+r.height/2?el.nextSibling:el)};el.ondragend=()=>{if(!dragging)return;dragging.classList.remove('dragging');const order=[...document.querySelectorAll('#layout [data-grid-slot]')].map(x=>x.dataset.blank==='true'?null:x.dataset.drag);activeCat.grid=order;save();render();renderSettings();dragging=null}});
 document.getElementById('colors').innerHTML=Object.entries(COLOR_NAMES).map(([k,n])=>`<label class="color"><input type="color" data-color="${k}" value="${data.colors[k]}"><span>${n}</span></label>`).join('');
 document.getElementById('subcolors').innerHTML=activeCat.subs.map(s=>`<label class="subcolor"><span class="subcolor-name" title="${esc(s.name)}">${esc(s.name)}</span><input type="color" data-sub-color="${s.id}" value="${s.color||data.colors.header}" title="Colour for ${esc(s.name)}"></label>`).join('');
 document.querySelectorAll('[data-sub-color]').forEach(i=>i.oninput=()=>{const sub=findSub(i.dataset.subColor);if(sub){sub.color=i.value;save();render()}});
 document.querySelectorAll('[data-color]').forEach(i=>i.oninput=()=>{data.colors[i.dataset.color]=i.value;applyColors();save()});
 document.getElementById('addCat').onclick=()=>{data.cats.push(makeCat('Category '+(data.cats.length+1)));data.active=data.cats.length-1;save();render();renderSettings()};
 document.getElementById('addSubcategory').onclick=()=>{const c=data.cats[data.active];const sub=makeSub('Subcategory '+(c.subs.length+1));c.subs.push(sub);c.grid.push(sub.id);save();render();renderSettings()};
 document.getElementById('addBlank').onclick=()=>{const c=data.cats[data.active];c.grid.push(null);save();render();renderSettings()};
 document.getElementById('seconds').oninput=e=>{data.copySeconds=Math.max(0,Number(e.target.value)||0);save()};
 document.getElementById('cancelS').onclick=closeModal;
 document.getElementById('saveS').onclick=()=>{save();closeModal();render();toast('Settings saved')}
}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quick-copy-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.getElementById('importBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));save();render();toast('Backup imported')}catch(x){alert('Invalid Quick Copy backup')}};r.readAsText(f);e.target.value=''};document.getElementById('exportBtn').onclick=exportData;document.getElementById('manageBtn').onclick=openManage;document.getElementById('settingsBtn').onclick=openSettings;document.getElementById('sideSettings').onclick=openSettings;document.getElementById('addTextBtn').onclick=openAddText;document.getElementById('search').oninput=render;document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};render();
</script></body></html>
